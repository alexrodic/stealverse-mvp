<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To‑Do — Stealverse MVP</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <h1>To‑Do</h1>
    <section class="input-row">
      <input id="newTodo" placeholder="What needs to be done?" autocomplete="off" />
      <button id="addBtn">Add</button>
    </section>

    <section class="controls">
      <div class="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="completed">Completed</button>
      </div>
      <button id="clearCompleted">Clear completed</button>
    </section>

    <ul id="list" class="todo-list" aria-live="polite"></ul>

    <footer class="footer">Tasks saved locally (localStorage)</footer>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
